services:
  bot:
    image: kitchenwarebot-bot:local
    build:
      context: .
      dockerfile: src/Bot/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=KitchenwareBot;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Redis__Connection: "redis:6379"
      Telegram__BotToken: "${Telegram__BotToken:?Set Telegram__BotToken in .env}"
    ports:
      - "${BOT_HTTP_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

volumes:
  sqlserver-data:
  redis-data:

networks:
  edge:
  backend:
    internal: true
